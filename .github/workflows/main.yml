name: Linting and testing on push or pull-request
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  pull_request:
    branches: [ dev, master ]
  push:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install node modules
      - run: npm install
      - name: build production
      - run: npm run build:prod
      - name: Run ts lint
      - run: npm run lint:ts
      - name: Run ts scss
      - run: npm run lint:scss
      - name: Run unit tests
      - run: npm run test

